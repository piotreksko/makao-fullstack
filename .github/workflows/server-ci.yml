name: Server CI

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-ci.yml']

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres and Redis next to the job, like docker-compose does locally
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: makao
          POSTGRES_PASSWORD: makao
          # The e2e tests connect to this database (see vitest.config.e2e.ts)
          POSTGRES_DB: makao_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U makao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t makao-server .
